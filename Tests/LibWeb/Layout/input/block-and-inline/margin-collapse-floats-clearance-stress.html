<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    #first {
        margin-bottom: 30px;
    }
    #first-inner {
        margin-bottom: 20px;
        height: 20px;
        width: 60px;
    }
    #second {
        margin-top: 25px;
    }
    #left-float {
        float: left;
        width: 50px;
        height: 60px;
    }
    #collapse-through {
        margin-top: 40px;
    }
    #cleared {
        clear: left;
        margin-top: 10px;
        height: 20px;
        width: 70px;
    }
    #right-float {
        float: right;
        width: 40px;
        height: 30px;
    }
    #after {
        margin-top: 15px;
        height: 20px;
        width: 80px;
    }
</style>
<div id="first">
    <div id="first-inner"></div>
</div>
<div id="second">
    <div id="left-float"></div>
    <div id="collapse-through">
        <div id="cleared"></div>
    </div>
    <div id="right-float"></div>
    <div id="after"></div>
</div>
