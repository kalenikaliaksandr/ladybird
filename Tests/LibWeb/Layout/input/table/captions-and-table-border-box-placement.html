<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    .table {
        display: table;
        border-collapse: separate;
        border-spacing: 0;
        border-top: 10px solid black;
        border-bottom: 6px solid black;
    }
    .caption-top {
        display: table-caption;
        caption-side: top;
        height: 30px;
        margin-top: 4px;
        margin-bottom: 2px;
    }
    .caption-bottom {
        display: table-caption;
        caption-side: bottom;
        height: 25px;
        margin-top: 3px;
    }
    .row {
        display: table-row;
    }
    .cell {
        display: table-cell;
        width: 50px;
        height: 20px;
    }
</style>
<div class="table">
    <div class="caption-top"></div>
    <div class="caption-bottom"></div>
    <div class="row"><div class="cell"></div></div>
</div>
