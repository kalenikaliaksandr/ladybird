<!DOCTYPE html>
<style>
    body {
        margin: 0;
        height: 200vh;
        background: white;
    }
    #window {
        position: absolute;
        left: 40px;
        top: 130px;
        width: 200px;
        height: 200px;
        border-radius: 30px;
        overflow: hidden;
    }
    /* Lands at the screen origin once the page is scrolled by 100px, reproducing the
       viewport-anchored gradient. */
    #viewport-gradient {
        position: absolute;
        left: -40px;
        top: -30px;
        width: 100vw;
        height: 100vh;
        background-image: linear-gradient(to bottom, red, blue);
    }
</style>
<div id="window"><div id="viewport-gradient"></div></div>
<script>
    window.scrollTo(0, 100);
</script>
