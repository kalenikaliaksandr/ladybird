<!DOCTYPE html>
<style>
    body {
        margin: 0;
        background: white;
    }
    #clip-box {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 150px;
        height: 150px;
        overflow: hidden;
    }
    #shadow {
        position: absolute;
        left: 60px;
        top: 60px;
        width: 100px;
        height: 100px;
        background: red;
    }
    #box {
        position: absolute;
        left: 0;
        top: 0;
        width: 100px;
        height: 100px;
        background: green;
    }
</style>
<div id="clip-box">
    <div id="shadow"></div>
    <div id="box"></div>
</div>
