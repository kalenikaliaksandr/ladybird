<!DOCTYPE html>
<style>
body { margin: 0; }
#scroll-container {
    width: 200px;
    height: 200px;
    background: lightgray;
}
#fixed-element {
    position: fixed;
    top: 50px;
    left: 50px;
    width: 100px;
    height: 100px;
    background: green;
}
</style>
<!-- Reference: The fixed element should be at top:50px left:50px regardless of scroll -->
<div id="scroll-container"></div>
<div id="fixed-element"></div>
