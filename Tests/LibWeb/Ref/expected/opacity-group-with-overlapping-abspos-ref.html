<!DOCTYPE html>
<style>
    body {
        margin: 0;
        background: white;
    }
    .opacity {
        position: relative;
        opacity: 0.5;
    }
    .inflow {
        position: absolute;
        left: 0;
        top: 0;
        width: 120px;
        height: 120px;
        background: green;
    }
    .abspos {
        position: absolute;
        left: 60px;
        top: 60px;
        width: 120px;
        height: 120px;
        background: green;
    }
</style>
<div class="opacity">
    <div class="inflow"></div>
    <div class="abspos"></div>
</div>
