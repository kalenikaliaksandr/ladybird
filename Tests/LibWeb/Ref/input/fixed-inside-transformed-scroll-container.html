<!DOCTYPE html>
<link rel="match" href="../expected/fixed-inside-transformed-scroll-container-ref.html" />
<style>
body { margin: 0; }
#transformed-scroll-container {
    width: 200px;
    height: 200px;
    overflow: auto;
    scrollbar-width: none;
    background: lightgray;
    /* Transform traps fixed positioning - fixed elements become relative to this container */
    transform: translateX(0);
}
.spacer {
    height: 1000px;
}
#fixed-element {
    position: fixed;
    top: 50px;
    left: 50px;
    width: 100px;
    height: 100px;
    background: green;
}
</style>
<!-- Fixed element inside a TRANSFORMED scroll container SHOULD scroll with it -->
<!-- Transform creates a containing block for fixed elements -->
<div id="transformed-scroll-container">
    <div id="fixed-element"></div>
    <div class="spacer"></div>
</div>
<script>
    document.getElementById("transformed-scroll-container").scrollTop = 50;
</script>
