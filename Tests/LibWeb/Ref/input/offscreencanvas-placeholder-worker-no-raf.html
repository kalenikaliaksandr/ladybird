<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../expected/offscreencanvas-placeholder-same-realm-ref.html">
<canvas id="canvas" width="100" height="100"></canvas>
<script>
    const workerScript = `
        self.onmessage = evt => {
            // Draw directly from the message handler: placeholder commits must not
            // depend on requestAnimationFrame being used in the worker.
            const context = evt.data.getContext("2d");
            context.fillStyle = "rgb(0, 128, 0)";
            context.fillRect(0, 0, 100, 100);
            self.postMessage("done");
        };
    `;
    const blob = new Blob([workerScript], { type: "application/javascript" });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = () => {
        let remaining_frames = 10;
        function tick() {
            if (--remaining_frames === 0) {
                document.documentElement.classList.remove("reftest-wait");
                return;
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    };

    const offscreen = canvas.transferControlToOffscreen();
    worker.postMessage(offscreen, [offscreen]);
</script>
</html>
