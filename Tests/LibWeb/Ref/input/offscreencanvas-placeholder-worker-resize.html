<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../expected/offscreencanvas-placeholder-worker-resize-ref.html">
<canvas id="canvas" width="100" height="100"></canvas>
<script>
    const workerScript = `
        self.onmessage = evt => {
            const canvas = evt.data;
            // Shrink the transferred canvas: the placeholder's dimensions must follow
            // the committed bitmap, not the original attributes.
            canvas.width = 50;
            canvas.height = 50;
            const context = canvas.getContext("2d");
            context.fillStyle = "rgb(0, 128, 0)";
            context.fillRect(0, 0, 50, 50);
            self.postMessage("done");
        };
    `;
    const blob = new Blob([workerScript], { type: "application/javascript" });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = () => {
        let remaining_frames = 10;
        function tick() {
            if (--remaining_frames === 0) {
                document.documentElement.classList.remove("reftest-wait");
                return;
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    };

    const offscreen = canvas.transferControlToOffscreen();
    worker.postMessage(offscreen, [offscreen]);
</script>
</html>
