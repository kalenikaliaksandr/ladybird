<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../expected/offscreencanvas-placeholder-same-realm-ref.html">
<canvas id="canvas" width="100" height="100"></canvas>
<script>
    const workerScript = `
        self.onmessage = evt => {
            const canvas = evt.data;
            const context = canvas.getContext("2d");
            let frames = 0;
            function drawFrame() {
                context.fillStyle = "rgb(0, 128, 0)";
                context.fillRect(0, 0, 100, 100);
                if (++frames === 3) {
                    self.postMessage("done");
                    return;
                }
                self.requestAnimationFrame(drawFrame);
            }
            self.requestAnimationFrame(drawFrame);
        };
    `;
    const blob = new Blob([workerScript], { type: "application/javascript" });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = () => {
        // The worker's last frame still has to travel worker -> Compositor ->
        // this document's commit notification; give it a few frames.
        let remaining_frames = 10;
        function tick() {
            if (--remaining_frames === 0) {
                document.documentElement.classList.remove("reftest-wait");
                return;
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    };

    const offscreen = canvas.transferControlToOffscreen();
    worker.postMessage(offscreen, [offscreen]);
</script>
</html>
