<!DOCTYPE html>
<link rel="match" href="../expected/opacity-group-with-overlapping-abspos-ref.html">
<!-- An absolutely positioned child whose containing block sits above its opacity ancestor still
     composites in the SAME opacity group as the in-flow content: one CSS opacity group is
     applied atomically, so the overlap must not be double-composited. -->
<style>
    body {
        margin: 0;
        background: white;
    }
    .relpos {
        position: relative;
    }
    .opacity {
        opacity: 0.5;
    }
    .inflow {
        width: 120px;
        height: 120px;
        background: green;
    }
    .abspos {
        position: absolute;
        left: 60px;
        top: 60px;
        width: 120px;
        height: 120px;
        background: green;
    }
</style>
<div class="relpos">
    <div class="opacity">
        <div class="inflow"></div>
        <div class="abspos"></div>
    </div>
</div>
