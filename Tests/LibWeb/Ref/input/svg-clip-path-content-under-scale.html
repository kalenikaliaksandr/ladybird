<!DOCTYPE html>
<link rel="match" href="../expected/svg-clip-path-content-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- Three clipPath constructs under a 10x viewBox scale that must all reveal
     the same green square: userSpaceOnUse units, objectBoundingBox units,
     and a transformed clip child. -->
<svg width="100" height="100" viewBox="0 0 10 10">
    <clipPath id="c1" clipPathUnits="userSpaceOnUse"><rect x="2" y="2" width="4" height="4"/></clipPath>
    <rect width="10" height="10" fill="green" clip-path="url(#c1)"/>
</svg>
<svg width="100" height="100" viewBox="0 0 10 10">
    <clipPath id="c2" clipPathUnits="objectBoundingBox"><rect x="0.25" y="0.25" width="0.5" height="0.5"/></clipPath>
    <rect width="8" height="8" fill="green" clip-path="url(#c2)"/>
</svg>
<svg width="100" height="100" viewBox="0 0 10 10">
    <clipPath id="c3" clipPathUnits="userSpaceOnUse"><rect width="4" height="4" transform="translate(2 2)"/></clipPath>
    <rect width="10" height="10" fill="green" clip-path="url(#c3)"/>
</svg>
