<!DOCTYPE html>
<link rel="match" href="../expected/svg-filter-region-and-offset-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- SVG filters under a 10x viewBox scale. The feFlood fill covers the
     filter bounds, which currently span the whole svg root; the feOffset
     displacement is in user units and must scale with the viewBox
     transform. -->
<svg width="100" height="100" viewBox="0 0 10 10">
    <filter id="flood" x="0" y="0" width="1" height="1"><feFlood flood-color="green"/></filter>
    <rect x="2" y="2" width="6" height="6" fill="red" filter="url(#flood)"/>
</svg>
<svg width="100" height="100" viewBox="0 0 10 10">
    <filter id="shift" x="-0.5" y="-0.5" width="2" height="2"><feOffset dx="1" dy="1"/></filter>
    <rect x="2" y="2" width="4" height="4" fill="green" filter="url(#shift)"/>
</svg>
