<!DOCTYPE html>
<link rel="match" href="../expected/svg-foreignobject-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- foreignObject content under a 10x viewBox scale: the content lays out
     in the viewport's user units and the whole subtree is scaled visually,
     so the 20x10 div overflows the 10x6 foreignObject box and is clipped
     to it, filling the scaled 100x60 area. -->
<svg width="200" height="100" viewBox="0 0 20 10">
    <foreignObject x="1" y="1" width="10" height="6">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width: 20px; height: 10px; background: green"></div>
    </foreignObject>
</svg>
