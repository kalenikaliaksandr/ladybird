<!DOCTYPE html>
<link rel="match" href="../expected/svg-nested-viewport-subunit-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- A nested viewport smaller than one user unit at a fractional position
     under a 40x viewBox scale: its overflow clip must not be snapped to
     whole units, or the content vanishes. -->
<svg width="800" height="400" viewBox="0 0 20 10">
    <svg x="5.5" y="2.5" width="0.5" height="0.5"><rect width="0.5" height="0.5" fill="green"/></svg>
</svg>
