<!DOCTYPE html>
<link rel="match" href="../expected/svg-overflow-visible-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- With overflow:visible on the svg root, content mapped by the viewBox
     transform past the viewport must still render. -->
<svg width="100" height="50" viewBox="0 0 10 5" style="overflow: visible">
    <rect x="8" y="1" width="6" height="2" fill="green"/>
</svg>
