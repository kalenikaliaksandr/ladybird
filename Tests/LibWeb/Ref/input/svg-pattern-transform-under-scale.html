<!DOCTYPE html>
<link rel="match" href="../expected/svg-pattern-transform-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- patternTransform rotate(90) under a 10x viewBox scale: the green cell
     lattice rotates about the user-space origin, so cells land at x in
     {2,6} instead of {0,4}. A 90-degree rotation keeps all edges axis
     aligned, so the comparison is exact. -->
<svg width="100" height="100" viewBox="0 0 10 10">
    <pattern id="p" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(90)"><rect width="2" height="2" fill="green"/></pattern>
    <rect width="8" height="8" fill="url(#p)"/>
</svg>
