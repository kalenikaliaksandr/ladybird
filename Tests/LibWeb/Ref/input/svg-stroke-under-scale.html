<!DOCTYPE html>
<link rel="match" href="../expected/svg-stroke-under-scale-ref.html" />
<style>body { margin: 0; } svg { display: block; }</style>
<!-- Stroke width and dash pattern are user units and must scale with the
     10x viewBox transform. -->
<svg width="200" height="100" viewBox="0 0 20 10">
    <rect x="4" y="3" width="8" height="4" fill="none" stroke="green" stroke-width="2"/>
</svg>
<svg width="200" height="100" viewBox="0 0 20 10">
    <line x1="2" y1="5" x2="18" y2="5" stroke="green" stroke-width="2" stroke-dasharray="2 2"/>
</svg>
