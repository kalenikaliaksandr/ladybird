<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    @keyframes slide {
        from { margin-left: 0px; }
        to { margin-left: 100px; }
    }
    #box {
        width: 50px;
        height: 50px;
        border-radius: 10px;
        background: green;
        animation: slide 100s linear paused;
    }
</style>
<div id="box"></div>
<script>
    // A frame recorded around the scroll positions is kept past its recording, for refreshes to record it again, with
    // the animated style it was published with. Moving the animation beside its recording replaces that style for the
    // next frame. The replaced style stays readable while the frame is kept, once the recording landed, and is freed
    // once the next frame takes the kept frame's place, though nothing styles.
    asyncTest(async done => {
        await startRecordingAroundScrollPositions();
        const animation = box.getAnimations()[0];
        const retiredOverlays = () => internals.styleEngineCounters().retiredAnimationOverlayRecords;
        const idle = async () => {
            do await nextTask();
            while (internals.frameSchedulerState() !== "idle");
        };
        await twoFramesLanded();
        const counts = await new Promise((resolve, reject) => {
            requestAnimationFrame(() => {
                internals.holdNextFrame();
                internals.setManualRenderingOpportunities(true);
                animation.currentTime = 10000;
                // Laid out here, so that what the rendering update lets fly is its recording.
                box.offsetWidth;
                setTimeout(async () => {
                    let held = true;
                    try {
                        animation.currentTime = 50000;
                        box.offsetWidth;
                        const keptBeside = retiredOverlays();
                        internals.releaseHeldFrame();
                        held = false;
                        await idle();
                        const keptOnceItLanded = retiredOverlays();
                        internals.injectRenderingOpportunity(performance.now());
                        await idle();
                        resolve({ keptBeside, keptOnceItLanded, keptOnceReplaced: retiredOverlays() });
                    } catch (e) {
                        reject(e);
                    } finally {
                        if (held) internals.releaseHeldFrame();
                        internals.setManualRenderingOpportunities(false);
                    }
                }, 0);
            });
        });
        println(`replaced overlays kept beside the recording: ${counts.keptBeside > 0}`);
        println(`replaced overlays kept with the kept frame once it landed: ${counts.keptOnceItLanded > 0}`);
        println(`replaced overlays kept once the next frame took its place: ${counts.keptOnceReplaced}`);
        println(`margin-left: ${getComputedStyle(box).marginLeft}`);
        println(`hit test finds the box: ${document.elementFromPoint(80, 30) === box}`);
        done();
    });
</script>
