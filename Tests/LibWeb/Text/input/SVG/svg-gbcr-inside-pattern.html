<!DOCTYPE html>
<script src="../include.js"></script>
<style>body { margin: 0; } svg { display: block; }</style>
<svg width="100" height="100" viewBox="0 0 10 10">
    <pattern id="p" patternUnits="userSpaceOnUse" width="4" height="4"><rect id="cell" width="2" height="2" fill="green"/></pattern>
    <rect width="8" height="8" fill="url(#p)"/>
</svg>
<script>
    asyncTest(async (done) => {
        // Recording the pattern's private display list must not corrupt the
        // main-tree visual context indices used by client rect queries.
        document.body.offsetHeight;
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const b = document.getElementById("cell").getBoundingClientRect();
        println(`${b.x},${b.y} ${b.width}x${b.height}`);
        println(Math.abs(b.x) < 0.01 && Math.abs(b.y) < 0.01 && Math.abs(b.width - 20) < 0.01 && Math.abs(b.height - 20) < 0.01 ? "PASS" : "FAIL");
        done();
    });
</script>
