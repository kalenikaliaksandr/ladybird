<!DOCTYPE html>
<script src="../include.js"></script>
<style>body { margin: 0; } svg { display: block; }</style>
<svg id="plain" width="200" height="100" viewBox="0 0 20 10">
    <svg x="3" y="2" width="10" height="5"><rect id="r1" x="1" y="1" width="4" height="3" fill="green"/></svg>
</svg>
<div style="transform: scale(0.5); transform-origin: 0 0">
    <svg width="200" height="100" viewBox="0 0 20 10" style="display: block">
        <svg x="3" y="2" width="10" height="5"><rect id="r2" x="1" y="1" width="4" height="3" fill="green"/></svg>
    </svg>
</div>
<script>
    test(() => {
        const round = (v) => Math.round(v * 1000) / 1000;
        for (const id of ["r1", "r2"]) {
            const b = document.getElementById(id).getBoundingClientRect();
            println(`${id}: ${round(b.x)},${round(b.y)} ${round(b.width)}x${round(b.height)}`);
        }
    });
</script>
