<!DOCTYPE html>
<script src="../include.js"></script>
<svg width="200" height="100" viewBox="0 0 20 10">
    <svg x="3" y="2" width="10" height="5"><rect id="r1" x="1" y="1" width="4" height="3" fill="green"/></svg>
    <svg x="2" y="1" width="10" height="6" viewBox="0 0 5 5"><rect id="r2" x="1" y="2" width="3" height="2" fill="blue"/></svg>
    <g transform="translate(2 3) scale(2)"><rect id="r3" x="1" y="1" width="4" height="2" fill="red"/></g>
</svg>
<script>
    test(() => {
        const round = (v) => Math.round(v * 1000) / 1000;
        for (const id of ["r1", "r2", "r3"]) {
            const b = document.getElementById(id).getBBox();
            println(`${id}: ${round(b.x)},${round(b.y)} ${round(b.width)}x${round(b.height)}`);
        }
    });
</script>
