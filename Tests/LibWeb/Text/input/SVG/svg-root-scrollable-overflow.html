<!DOCTYPE html>
<script src="../include.js"></script>
<style>body { margin: 0; } svg { display: block; }</style>
<svg id="s" width="100" height="100" viewBox="0 0 1000 1000"><rect width="1000" height="1000"/></svg>
<script>
    test(() => {
        // An svg root clips its content: user-unit geometry inside must not
        // leak into scrollable overflow.
        const s = document.getElementById("s");
        println(s.scrollWidth + "x" + s.scrollHeight);
    });
</script>
