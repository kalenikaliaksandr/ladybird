<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        const workerScript = `
            self.onmessage = function() {
                try {
                    const canvas = new OffscreenCanvas(8, 8);
                    const context = canvas.getContext("2d");
                    context.fillStyle = "#ff0000";
                    context.fillRect(0, 0, 8, 8);
                    context.fillStyle = "rgb(0, 128, 0)";
                    context.fillRect(2, 2, 4, 4);

                    const imageData = context.getImageData(0, 0, 8, 8);
                    const cornerPixel = Array.from(imageData.data.slice(0, 4));
                    const centerOffset = (4 * 8 + 4) * 4;
                    const centerPixel = Array.from(imageData.data.slice(centerOffset, centerOffset + 4));
                    self.postMessage("corner: " + JSON.stringify(cornerPixel));
                    self.postMessage("center: " + JSON.stringify(centerPixel));
                    self.postMessage(null);
                } catch (err) {
                    self.postMessage("Error: " + err);
                    self.postMessage(null);
                }
            };
        `;
        const blob = new Blob([workerScript], { type: "application/javascript" });
        const worker = new Worker(URL.createObjectURL(blob));

        worker.onmessage = function (evt) {
            if (evt.data === null) {
                done();
                return;
            }
            println("Message received from worker: " + evt.data);
        };

        worker.postMessage("start");
    });
</script>
