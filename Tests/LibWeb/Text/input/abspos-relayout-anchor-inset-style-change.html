<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
    #stage { position: relative; width: 400px; height: 300px; }
    #anchor {
        anchor-name: --btn;
        position: absolute;
        left: 60px;
        top: 40px;
        width: 100px;
        height: 30px;
    }
    #boundary {
        position: absolute;
        position-anchor: --btn;
        left: 10px;
        top: 10px;
        width: 80px;
        height: 25px;
    }
</style>
<div id="stage">
    <div id="anchor"></div>
    <div id="boundary"></div>
</div>
<script>
    // A style change that puts anchor() functions into a boundary's own insets stays on the
    // partial relayout path: the replay re-resolves them against the committed geometry of
    // the out-of-subtree anchor, landing the boundary at its anchored position exactly as a
    // full layout would.
    function rectToString(rect) {
        return `${rect.left},${rect.top},${rect.width},${rect.height}`;
    }

    asyncTest(async (done) => {
        document.body.offsetHeight;

        const boundaryBefore = document.getElementById("boundary").getBoundingClientRect();
        const partialBefore = internals.partialLayoutCount();
        const fullBefore = internals.fullLayoutCount();
        const boundaryStyle = document.getElementById("boundary").style;
        boundaryStyle.left = "anchor(right)";
        boundaryStyle.top = "anchor(top)";
        document.body.offsetHeight;
        const partialDelta = internals.partialLayoutCount() - partialBefore;
        const fullDelta = internals.fullLayoutCount() - fullBefore;

        const anchor = document.getElementById("anchor").getBoundingClientRect();
        const boundaryAfter = document.getElementById("boundary").getBoundingClientRect();
        println(`layout-passes partial=${partialDelta} full=${fullDelta}`);
        println(`anchor=${rectToString(anchor)}`);
        println(`boundary-before=${rectToString(boundaryBefore)}`);
        println(`boundary-after=${rectToString(boundaryAfter)}`);
        println(partialDelta === 1 && fullDelta === 0
            && rectToString(anchor) === "60,40,100,30"
            && rectToString(boundaryBefore) === "10,10,80,25"
            && rectToString(boundaryAfter) === "160,40,80,25" ? "PASS" : "FAIL");
        done();
    });
</script>
