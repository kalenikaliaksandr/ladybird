<!DOCTYPE html>
<script src="include.js"></script>
<style>
    #base {
        width: 300px;
        height: 300px;
        font-size: 0;
    }
    #r1 {
        position: relative;
        top: 5px;
        left: 7px;
        width: 200px;
    }
    #r2 {
        position: relative;
        top: 11px;
        left: 3px;
        width: 180px;
    }
    #r3 {
        position: relative;
        top: 2px;
        left: 9px;
        width: 160px;
    }
    #spacer {
        height: 15px;
    }
    #abs {
        position: absolute;
        width: 10px;
        height: 10px;
    }
</style>
<div id="base">
    <div id="r1">
        <div id="r2">
            <div id="r3">
                <div id="spacer"></div>
                <div id="abs"></div>
            </div>
        </div>
    </div>
</div>
<script>
    // #abs has no insets under three nested relative-positioned ancestors with
    // nonzero insets. Its containing block is the innermost one (#r3), and the
    // relative offsets of the whole chain are applied at paint time, so #abs
    // must track #r3 exactly: 15px below its content top (after the spacer),
    // with all of the chain's relative shifts included.
    test(() => {
        const baseRect = document.getElementById("base").getBoundingClientRect();
        const r3Rect = document.getElementById("r3").getBoundingClientRect();
        const absRect = document.getElementById("abs").getBoundingClientRect();
        println(`r3 offset: ${r3Rect.x - baseRect.x},${r3Rect.y - baseRect.y}`);
        println(`abs offset: ${absRect.x - baseRect.x},${absRect.y - baseRect.y}`);
        println(`abs offset within r3: ${absRect.x - r3Rect.x},${absRect.y - r3Rect.y}`);
    });
</script>
