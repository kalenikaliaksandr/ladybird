<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; height: 30000px; background: linear-gradient(white, teal); }
</style>
<script>
// The compositor scrolls to the end for the End key, past what the display list records, and asks for a recording
// there, which comes to record the bottom of the page and leave out its top.
promiseTest(async () => {
    await startRecordingAroundScrollPositions();
    await interestCoverageSettled();

    await scrollSettled(document, () => internals.sendKeyThroughUIProcess("End"));
    await interestCoverageSettled();
    const scrollHeight = document.documentElement.scrollHeight;
    println(`scrolled to the end: ${window.scrollY + window.innerHeight >= scrollHeight - 1}`);
    const { recordedRect: recorded } = internals.compositorScrollState();
    println(`the list records the bottom: ${recorded.y + recorded.height >= scrollHeight}`);
    println(`it leaves out the top: ${recorded.y > 0}`);
});
</script>
