<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; height: 30000px; background: linear-gradient(white, teal); }
    #far-scroller { position: absolute; top: 25000px; width: 200px; height: 200px; overflow: auto; }
    #far-scroller > div { height: 1000px; }
</style>
<div id="far-scroller"><div></div></div>
<script>
// The compositor leaves a touchpad gesture that starts over content whose wheel routing the display list leaves out to
// the main thread, which latches it. A display list that records there arrives mid-gesture, and the rest of the gesture
// stays with the main thread rather than scrolling whatever the compositor's own hit test would latch.
promiseTest(async () => {
    await startRecordingAroundScrollPositions();
    await interestCoverageSettled();

    internals.holdInterestRefreshes();
    await scrollSettled(document, () => internals.wheelThroughUIProcess(400, 300, 0, 9000, true));
    const scrolledPastWhatIsRecorded = await waitForCondition(() => internals.compositorWheelTargetAt(400, 400, 0, 100).decision === "not-recorded-at-position");
    println(`scrolled past what the list records: ${scrolledPastWhatIsRecorded}`);

    internals.beginInputTrace();
    await internals.wheelThroughUIProcess(400, 400, 0, 50, true, "ongoing");
    internals.releaseInterestRefreshes();
    const recordedThere = await waitForCondition(() => internals.compositorWheelTargetAt(400, 400, 0, 100).decision !== "not-recorded-at-position");
    await internals.wheelThroughUIProcess(400, 400, 0, 50, true, "ongoing");
    await internals.wheelThroughUIProcess(400, 400, 0, 0, true, "ended");
    printInputTrace(internals.takeInputTrace(), { stages: ["compositor"] });
    println(`a list that records there arrived mid-gesture: ${recordedThere}`);
});
</script>
