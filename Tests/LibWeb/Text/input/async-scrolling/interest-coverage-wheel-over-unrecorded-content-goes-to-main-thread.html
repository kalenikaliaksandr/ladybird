<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; height: 30000px; background: linear-gradient(white, teal); }
    #far-scroller { position: absolute; top: 25000px; width: 200px; height: 200px; overflow: auto; }
    #far-scroller > div { height: 1000px; }
</style>
<div id="far-scroller"><div></div></div>
<script>
// A display list that leaves out the wheel routing of content far away has the compositor leave a wheel over content it
// shows past what the list records to the main thread, which scrolls along its own hit test. With the compositor's
// request held, it is the main thread's scroll that has the next frame record around where the page went.
promiseTest(async () => {
    await startRecordingAroundScrollPositions();
    await interestCoverageSettled();
    println(`the list leaves out the far scroller's wheel routing, over the page: ${wheelTargetToString(internals.compositorWheelTargetAt(400, 300, 0, 100))}`);

    internals.holdInterestRefreshes();
    await scrollSettled(document, () => internals.wheelThroughUIProcess(400, 300, 0, 9000, true));
    await waitForCondition(() => internals.compositorWheelTargetAt(400, 300, 0, 100).decision === "not-recorded-at-position");
    println(`scrolled past what the list records, over the page: ${wheelTargetToString(internals.compositorWheelTargetAt(400, 300, 0, 100))}`);

    // Away from where the last gesture started, the wheel starts a gesture of its own, which the compositor hit tests.
    const scrollYBeforeWheel = window.scrollY;
    internals.beginInputTrace();
    await scrollSettled(document, () => internals.wheelThroughUIProcess(400, 400, 0, 100, true));
    printInputTrace(internals.takeInputTrace(), { stages: ["compositor"] });
    println(`the main thread scrolled the page: ${window.scrollY > scrollYBeforeWheel}`);

    const recordedThere = await waitForCondition(() => internals.compositorWheelTargetAt(400, 400, 0, 100).decision !== "not-recorded-at-position");
    println(`the main thread's frame records there: ${recordedThere}, over the page: ${wheelTargetToString(internals.compositorWheelTargetAt(400, 400, 0, 100))}`);
    internals.releaseInterestRefreshes();
});
</script>
