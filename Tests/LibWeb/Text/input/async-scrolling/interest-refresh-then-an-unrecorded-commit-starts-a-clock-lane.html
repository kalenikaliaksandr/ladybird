<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../HTML/frame-in-flight/frame-in-flight.js"></script>
<style>
    body { margin: 0; height: 30000px; }
    #target { position: absolute; top: 300px; left: 0; width: 200px; height: 50px; background: rgb(0, 0, 255); }
    #target:hover { background: rgb(0, 128, 0); }
</style>
<div id="target"></div>
<script>
// A refresh presents a display list that records more than the last committed frame's. A main-thread scroll within what
// the refresh recorded then commits a frame that keeps that list, whose clock lane starts from what the refreshes
// recorded: its hover frame presents beside the event loop without waiting for a frame that records, and records no less
// of the page than the refresh.
promiseTest(async () => {
    await startRecordingAroundScrollPositions();
    await interestCoverageSettled();
    internals.mouseMove(100, 100);
    await nextFrame();

    // Within one task, so that no rendering update commits a frame meanwhile.
    internals.injectInterestRefresh({ left: -Infinity, top: 0, right: Infinity, bottom: 20000 });
    const recordsTheRect = () => {
        const recorded = internals.compositorScrollState().recordedRect;
        return recorded.y <= 0 && recorded.y + recorded.height >= 20000;
    };
    const recorded = conditionHoldsWithinTask(recordsTheRect);
    const presentedByTheRefresh = internals.lastFramePresentedBy(document);
    const contentGeneration = internals.compositorInterestRefreshState().contentGeneration;

    internals.setManualRenderingOpportunities(true);
    let result;
    try {
        window.scrollTo(0, 100);
        await nextTask();
        const frameTime = performance.now();
        internals.injectRenderingOpportunity(frameTime);
        do await nextTask();
        while (internals.frameSchedulerState() !== "idle" || internals.clockLaneIsComing(document));
        const scrollFramePresentedBy = internals.lastFramePresentedBy(document);
        const scrollFrameKeptTheList =
            internals.compositorInterestRefreshState().contentGeneration === contentGeneration;
        const laneState = internals.clockLaneState(document);
        internals.injectHoverPointer(100, 225, frameTime + 16);
        result = {
            scrollFramePresentedBy,
            scrollFrameKeptTheList,
            laneState,
            hoverPresentedByTheClock: conditionHoldsWithinTask(
                () => internals.lastFramePresentedBy(document) === "clock"
            ),
            hoverFrameRecordsTheRect: conditionHoldsWithinTask(
                () =>
                    internals.compositorInterestRefreshState().contentGeneration !== contentGeneration &&
                    recordsTheRect()
            ),
        };
    } finally {
        internals.setManualRenderingOpportunities(false);
    }
    println(`the refresh recorded the rect: ${recorded}`);
    println(`presented by: ${presentedByTheRefresh}`);
    println(`the scroll's frame presented by: ${result.scrollFramePresentedBy}`);
    println(`the scroll's frame kept the list: ${result.scrollFrameKeptTheList}`);
    println(`the scroll's frame's lane: ${result.laneState}`);
    println(`the hover presented by the clock: ${result.hoverPresentedByTheClock}`);
    println(`the hover's frame records the rect: ${result.hoverFrameRecordsTheRect}`);
    println(`the list records what shows: ${await interestCoverageSettled()}`);
});
</script>
