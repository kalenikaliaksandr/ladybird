<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        const canvas = new OffscreenCanvas(4, 4);
        const gl = canvas.getContext("webgl");
        if (!gl) {
            println("FAIL: no webgl context");
            return;
        }
        gl.clearColor(1, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        const bitmap = canvas.transferToImageBitmap();
        println("bitmap size: " + bitmap.width + "x" + bitmap.height);

        // The drawing buffer must be reset by the transfer: reading it back now must
        // not return the transferred red frame.
        const pixels = new Uint8Array(4);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        println("pixel after transfer: " + JSON.stringify(Array.from(pixels)));
    });
</script>
