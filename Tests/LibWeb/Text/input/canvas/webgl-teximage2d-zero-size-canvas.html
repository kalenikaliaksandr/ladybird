<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        // Uploading a zero-size canvas must not crash the renderer.
        const gl = document.createElement("canvas").getContext("webgl");
        if (!gl) {
            println("webgl unavailable");
            return;
        }
        const zeroCanvas = document.createElement("canvas");
        zeroCanvas.width = 0;
        zeroCanvas.height = 0;
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, zeroCanvas);
        println("texImage2D from zero-size canvas did not crash");
    });
</script>
