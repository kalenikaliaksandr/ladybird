<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    .stripe { height: 100px; }
    .stripe:nth-child(odd) { background: lightblue; }
    .stripe:nth-child(even) { background: lightyellow; }
    #reader { position: absolute; left: 40px; top: 120px; width: 120px; height: 60px; background: rgba(200, 100, 50, 0.5); backdrop-filter: grayscale(1); }
</style>
<div id="reader"></div>
<script>
    asyncTest(async done => {
        const uniqueColor = colorUniqueToThisPageLoad();
        for (let index = 0; index < 30; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripe.textContent = `stripe ${index}`;
            if (index % 2)
                stripe.style.background = uniqueColor;
            document.body.appendChild(stripe);
        }
        await presentedFrameStateOnceNothingIsLeftToRasterize();
        const results = [];
        for (const y of [100, 300, 0]) {
            window.scrollTo(0, y);
            results.push([y, await presentedFrameState()]);
        }
        for (const [y, state] of results) {
            printPresentedFrameState(state);
            println(`scrolled to ${y}, tiles rasterized: ${state.tilesRasterizedSinceLastCheck}`);
        }
        done();
    });
</script>
