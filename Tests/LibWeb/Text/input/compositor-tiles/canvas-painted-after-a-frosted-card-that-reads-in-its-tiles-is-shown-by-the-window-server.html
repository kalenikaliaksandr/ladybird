<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    .stripe { height: 40px; }
    .stripe:nth-child(odd) { background: teal; }
    .stripe:nth-child(even) { background: salmon; }
    #card { position: absolute; left: 60px; top: 60px; width: 300px; height: 200px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); }
    /* Over part of the card, so the card's layer goes below the canvas's. */
    canvas { position: absolute; left: 300px; top: 120px; }
</style>
<div id="stripes"></div>
<div id="card"></div>
<canvas id="canvas" width="200" height="100"></canvas>
<script>
    asyncTest(async done => {
        for (let index = 0; index < 12; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripes.appendChild(stripe);
        }
        const context = canvas.getContext("2d");
        context.fillStyle = "navy";
        context.fillRect(0, 0, canvas.width, canvas.height);
        const state = await presentedFrameStateOnceNothingIsLeftToRasterize();
        println(layersOfTheDisplayListWithEffectsNamedByTheirBoxes());
        printPresentedFrameState(state);
        done();
    });
</script>
