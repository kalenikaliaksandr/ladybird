<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    canvas { position: absolute; left: 20px; top: 20px; }
    #overlay { position: absolute; left: 100px; top: 60px; width: 300px; height: 40px; background: rgba(255, 255, 255, 0.5); }
</style>
<canvas id="canvas" width="400" height="200"></canvas>
<div id="overlay"></div>
<script>
    asyncTest(async done => {
        const context = canvas.getContext("2d");
        for (let frame = 0; frame < 6; ++frame) {
            context.fillStyle = `rgb(0, 0, ${100 + frame * 20})`;
            context.fillRect(0, 0, canvas.width, canvas.height);
            await animationFrame();
            await animationFrame();
        }
        overlay.style.left = "150px";
        printPresentedFrameState(await presentedFrameState(), 2);
        done();
    });
</script>
