<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; height: 3000px; }
    .box { position: absolute; width: 20px; height: 20px; background: red; }
</style>
<div class="box" style="left: 10px; top: 10px"></div>
<div class="box" style="left: 300px; top: 150px"></div>
<div class="box" id="changing" style="left: 600px; top: 530px"></div>
<div class="box" style="left: 100px; top: 1200px"></div>
<script>
    asyncTest(async done => {
        await presentedFrameStateOnceNothingIsLeftToRasterize();
        // A color no earlier load drew, so that no chunk the compositor still keeps holds the changed box.
        changing.style.background = colorUniqueToThisPageLoad();
        const state = await presentedFrameState();
        printPresentedFrameState(state);
        println(`layer stacks computed: ${state.layerStacksComputedSinceLastCheck}`);
        println(`chunks placed: ${state.chunksPlacedSinceLastCheck}`);
        println(`tiles binned: ${state.tilesBinnedSinceLastCheck}`);
        println(`tiles rasterized: ${state.tilesRasterizedSinceLastCheck}`);
        done();
    });
</script>
