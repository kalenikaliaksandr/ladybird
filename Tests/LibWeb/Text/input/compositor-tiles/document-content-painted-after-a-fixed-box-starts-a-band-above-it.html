<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    .stripe { height: 100px; }
    .stripe:nth-child(odd) { background: lightblue; }
    .stripe:nth-child(even) { background: lightyellow; }
    #fixed-header { position: fixed; left: 0; top: 0; width: 800px; height: 40px; background: rgb(0, 0, 120); }
    #painted-after-the-header { position: absolute; left: 300px; top: 1500px; width: 50px; height: 50px; z-index: 1; background: rgb(0, 120, 0); }
</style>
<div id="stripes"></div>
<div id="fixed-header"></div>
<div id="painted-after-the-header"></div>
<script>
    asyncTest(async done => {
        for (let index = 0; index < 30; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripes.appendChild(stripe);
        }
        const state = await presentedFrameStateOnceNothingIsLeftToRasterize();
        const layers = layersOfTheDisplayList();
        const header = layersOfTheFillOfColor("rgb(0, 0, 120)");
        const paintedAfterTheHeader = layersOfTheFillOfColor("rgb(0, 120, 0)");
        println(layers);
        println(`fixed header: ${header}`);
        println(`box painted after the header: ${paintedAfterTheHeader}`);
        printPresentedFrameState(state);
        done();
    });
</script>
