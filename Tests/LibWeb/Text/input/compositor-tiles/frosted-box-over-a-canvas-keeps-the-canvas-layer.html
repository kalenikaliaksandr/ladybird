<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    canvas { position: absolute; left: 40px; top: 40px; }
    #card { position: absolute; left: 100px; top: 80px; width: 200px; height: 80px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(6px); }
</style>
<canvas id="canvas" width="300" height="200"></canvas>
<div id="card">card</div>
<script>
    function drawStripes(context, offset) {
        for (let x = 0; x < canvas.width; x += 20) {
            context.fillStyle = (x / 20 + offset) % 2 ? "navy" : "orange";
            context.fillRect(x, 0, 20, canvas.height);
        }
    }

    asyncTest(async done => {
        const context = canvas.getContext("2d");
        drawStripes(context, 0);
        await presentedFrameStateOnceNothingIsLeftToRasterize();
        drawStripes(context, 1);
        const state = await presentedFrameState();
        println(layersOfTheDisplayList());
        printPresentedFrameState(state, ROUNDING_OF_TEXT_OVER_A_TRANSLUCENT_BACKGROUND_IN_A_LAYER);
        println(`canvas redrawn, tiles rasterized: ${state.tilesRasterizedSinceLastCheck}`);
        done();
    });
</script>
