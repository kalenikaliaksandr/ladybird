<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    .stripe { height: 40px; }
    .stripe:nth-child(odd) { background: crimson; }
    .stripe:nth-child(even) { background: gold; }
    .frosted { width: 300px; height: 180px; border-radius: 40px 10px 60px 20px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); }
    /* It finds all it reads in the document's layer, so it reads it in its tiles. */
    #in-the-document { position: absolute; left: 60px; top: 50px; }
    /* The document scrolls under it, so it gets a layer of its own. */
    #fixed { position: fixed; left: 420px; top: 330px; }
</style>
<div id="stripes"></div>
<div class="frosted" id="in-the-document"></div>
<div class="frosted" id="fixed"></div>
<script>
    asyncTest(async done => {
        for (let index = 0; index < 20; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripes.appendChild(stripe);
        }
        const state = await presentedFrameStateOnceNothingIsLeftToRasterize();
        println(layersOfTheDisplayList());
        printPresentedFrameState(state);
        done();
    });
</script>
