<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    .stripe { height: 50px; }
    .stripe:nth-child(odd) { background: lightblue; }
    .stripe:nth-child(even) { background: darkolivegreen; }
    .inverting { width: 250px; height: 120px; backdrop-filter: invert(1); }
    /* It finds all it reads in the document's layer, so it reads it in its tiles. */
    #in-the-document { position: absolute; left: 100px; top: 70px; }
    /* The document scrolls under it, so it gets a layer of its own. */
    #fixed { position: fixed; left: 450px; top: 330px; }
</style>
<div id="stripes"></div>
<div class="inverting" id="in-the-document">inverted</div>
<div class="inverting" id="fixed">inverted</div>
<script>
    asyncTest(async done => {
        for (let index = 0; index < 20; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripe.textContent = `stripe ${index}`;
            stripes.appendChild(stripe);
        }
        const state = await presentedFrameStateOnceNothingIsLeftToRasterize();
        println(layersOfTheDisplayList());
        printPresentedFrameState(state);
        done();
    });
</script>
