<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    #page { height: 3000px; background: lightyellow; }
    #scroller { position: absolute; left: 20px; top: 150px; width: 200px; height: 200px; overflow: scroll; scrollbar-width: none; }
    .stripe { height: 50px; }
    .stripe:nth-child(odd) { background: lightgreen; }
    #translucent-frosted-box { position: absolute; left: 60px; top: 200px; width: 100px; height: 40px; opacity: 0.5; background: rgba(0, 0, 128, 0.3); backdrop-filter: blur(4px); }
</style>
<div id="page"></div>
<div id="scroller"></div>
<div id="translucent-frosted-box"></div>
<script>
    asyncTest(async done => {
        const uniqueColor = colorUniqueToThisPageLoad();
        for (let index = 0; index < 40; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            if (index % 2)
                stripe.style.background = uniqueColor;
            scroller.appendChild(stripe);
        }
        await presentedFrameStateOnceNothingIsLeftToRasterize();
        // The scrollport covers two tiles of the document.
        scroller.scrollTop = 120;
        const state = await presentedFrameState();
        println(layersOfTheDisplayList());
        printPresentedFrameState(state);
        println(`scrolled the scroller, tiles binned: ${state.tilesBinnedSinceLastCheck}, tiles rasterized: ${state.tilesRasterizedSinceLastCheck}`);
        done();
    });
</script>
