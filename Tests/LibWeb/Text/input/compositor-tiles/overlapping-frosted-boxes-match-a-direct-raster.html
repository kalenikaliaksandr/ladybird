    #above { left: 180px; top: 120px; backdrop-filter: grayscale(1) blur(3px); }

<div id="stripes"></div>
<div class="frosted" id="below">below</div>
<div class="frosted" id="above">above</div>
<script>
    asyncTest(async done => {
        for (let index = 0; index < 20; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripes.appendChild(stripe);
        }
        const state = await presentedFrameStateOnceNothingIsLeftToRasterize();
        println(layersOfTheDisplayList());
        printPresentedFrameState(state, ROUNDING_OF_TEXT_OVER_A_TRANSLUCENT_BACKGROUND_IN_A_LAYER);
        done();
    });
</script>
