<!DOCTYPE html>
<script src="../include.js"></script>
<script src="presented-frame.js"></script>
<style>
    body { margin: 0; }
    #header { position: sticky; top: 0; height: 50px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px) saturate(2); }
    .stripe { height: 100px; }
    .stripe:nth-child(odd) { background: lightblue; }
    .stripe:nth-child(even) { background: lightyellow; }
</style>
<div class="stripe">first stripe</div>
<div id="header">sticky header</div>
<script>
    asyncTest(async done => {
        const uniqueColor = colorUniqueToThisPageLoad();
        for (let index = 0; index < 30; ++index) {
            const stripe = document.createElement("div");
            stripe.className = "stripe";
            stripe.textContent = `stripe ${index}`;
            if (index % 2)
                stripe.style.background = uniqueColor;
            document.body.appendChild(stripe);
        }
        await presentedFrameStateOnceNothingIsLeftToRasterize();
        const results = [];
        for (const y of [200, 400]) {
            window.scrollTo(0, y);
            results.push([y, await presentedFrameState()]);
        }
        println(layersOfTheDisplayList());
        for (const [y, state] of results) {
            printPresentedFrameState(state, ROUNDING_OF_TEXT_OVER_A_TRANSLUCENT_BACKGROUND_IN_A_LAYER);
            println(`scrolled to ${y}, layer stacks computed: ${state.layerStacksComputedSinceLastCheck}, layers created: ${state.layersCreatedSinceLastCheck}`);
        }
        done();
    });
</script>
