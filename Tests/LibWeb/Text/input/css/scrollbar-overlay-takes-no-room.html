<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    .box {
        width: 100px;
        height: 100px;
        border: 1px solid black;
        padding: 4px;
    }
</style>
<div id="scroll" class="box" style="overflow: scroll"></div>
<div id="scroll-border-box" class="box" style="overflow: scroll; box-sizing: border-box"></div>
<div id="hidden-stable" class="box" style="overflow: hidden; scrollbar-gutter: stable"></div>
<div id="auto-stable-both-edges" class="box" style="overflow: auto; scrollbar-gutter: stable both-edges"></div>
<div id="auto-overflowing" class="box" style="overflow: auto"><div style="width: 200px; height: 200px"></div></div>
<div id="thin" class="box" style="overflow: scroll; scrollbar-width: thin"></div>
<div id="none" class="box" style="overflow: scroll; scrollbar-width: none"></div>
<div id="scroll-y-rtl" class="box" style="overflow-y: scroll; direction: rtl"></div>
<div style="width: 300px"><div id="auto-width" style="overflow: scroll; border: 1px solid black"></div></div>
<div id="inline-block" style="display: inline-block; overflow-y: scroll"><div style="width: 50px; height: 10px"></div></div>
<div id="tall-filler" style="width: 10px; height: 2000px"></div>
<script src="../include.js"></script>
<script>
    test(() => {
        internals.setScrollbarStyle("overlay");

        for (const element of document.querySelectorAll(".box, #auto-width, #inline-block")) {
            println(
                `${element.id}: offset=${element.offsetWidth}x${element.offsetHeight} ` +
                    `client=${element.clientWidth}x${element.clientHeight} ` +
                    `clientLeft=${element.clientLeft} clientTop=${element.clientTop}`
            );
        }

        const root = document.documentElement;
        println(`root: inner=${window.innerWidth}x${window.innerHeight} client=${root.clientWidth}x${root.clientHeight}`);
        println(`elementFromPoint at the viewport's right edge: ${document.elementFromPoint(window.innerWidth - 2, 10)?.tagName}`);
        println(`a layout dump mentions gutters: ${internals.dumpLayoutTree(document.body).includes("scrollbar-gutters")}`);
    });
</script>
