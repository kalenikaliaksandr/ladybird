<!doctype html>
<script src="../include.js"></script>
<style>
    body { margin: 0; }
    #box { position: absolute; width: 100px; height: 100px; background: green; }
</style>
<div id="box"></div>
<script>
    // A hit test reads the document's rows as they are, so it finds a box where a change that no frame has shown
    // yet put it, records nothing, and leaves the change for the next frame to record.
    promiseTest(async () => {
        const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
        const settle = async () => {
            await nextFrame();
            await nextFrame();
            do await new Promise(resolve => setTimeout(resolve));
            while (internals.frameSchedulerState() !== "idle");
        };
        const recordingCount = () => (internals.takeDisplayListTrace().match(/^recording /gm) ?? []).length;
        // Printing changes the document and would invalidate the recording under test.
        const results = [];
        await settle();
        for (const left of [10, 200, 20]) {
            box.style.left = `${left}px`;
            internals.beginDisplayListTrace();
            const target = document.elementFromPoint(50, 50);
            const caret = document.caretPositionFromPoint(50, 50);
            results.push(`left=${left}: hit target=${target.id || target.localName}, caret in ${caret.offsetNode.id || caret.offsetNode.nodeName}, recordings=${recordingCount()}`);

            internals.beginDisplayListTrace();
            await settle();
            results.push(`left=${left}: subsequent frame recordings=${recordingCount()}`);
        }
        for (const result of results) println(result);
    });
</script>
