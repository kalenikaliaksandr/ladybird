<!doctype html>
<html>
<script src="../include.js"></script>
<style>
    body { margin: 0; height: 12000px; }
    #scroller { position: absolute; top: 8000px; left: 0; width: 300px; height: 200px; overflow: auto; scroll-snap-type: y mandatory; }
    .item { height: 200px; scroll-snap-align: start; background: orange; }
</style>
<body>
<div id="scroller"><div class="item" id="first"></div><div class="item"></div><div class="item"></div></div>
<script>
// A committed frame recorded around the scroll positions at the top records none of the content of a scroller far
// below, while the compositor still holds its scroll node and snap geometry, and the wheel listener inside it still
// blocks wheels.
first.addEventListener("wheel", () => {}, { passive: false });
promiseTest(async () => {
    await startRecordingAroundScrollPositions();
    await interestCoverageSettled();
    const viewport = internals.compositorScrollState();
    println(`the page's list leaves out the scroller: ${viewport.recordedRect.y + viewport.recordedRect.height < scroller.offsetTop}`);
    const scrollerNode = viewport.scrollNodes.find(node => !node.isViewport);
    println(`scroll nodes: ${viewport.scrollNodeCount}, scroller listed: ${scrollerNode !== undefined}`);
    println(`scroller records none of its content: ${scrollerNode.recordedRect.width * scrollerNode.recordedRect.height === 0}`);
    println(`snap containers: ${viewport.snapContainers.length}, snap areas: ${viewport.snapContainers[0]?.areas.length}`);
    println(`has blocking wheel event listeners: ${viewport.hasBlockingWheelEventListeners}`);
});
</script>
