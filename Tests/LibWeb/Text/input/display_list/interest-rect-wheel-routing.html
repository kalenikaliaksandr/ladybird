<!doctype html>
<html>
<script src="../include.js"></script>
<script src="interest-rect-test.js"></script>
<style>
    body { margin: 0; height: 6000px; }
    #scroller { position: absolute; top: 4000px; left: 0; width: 300px; height: 200px; overflow: auto; }
    #scroller > div { height: 600px; background: orange; }
    #modal { position: fixed; top: 300px; left: 400px; width: 200px; height: 200px; overflow: auto; background: teal; }
    #modal > div { height: 800px; }
</style>
<body>
<div id="scroller"><div></div></div>
<div id="modal"><div></div></div>
<script>
// A list that leaves out the wheel routing of content outside what it records sends a wheel over such content, once
// scrolled into view, to the main thread, which hit tests the whole document, and holds back wheels there for blocking
// listeners it may leave out. A fixed scroller over such content is no exception: what the list leaves out of the page
// may be painted above it.
interestRectTest(output => {
    // Reading where an element is brings the scroll offsets the recorded list is routed at up to date, without
    // recording another list.
    const wheelTargetOver = element => {
        const rect = element.getBoundingClientRect();
        return wheelTargetToString(internals.recordedDisplayListWheelTargetAt(rect.left + 50, rect.top + 50, 0, 10));
    };
    const blocksWheelsOver = element => {
        const rect = element.getBoundingClientRect();
        return internals.recordedDisplayListBlocksWheelEventAt(rect.left + 50, rect.top + 50);
    };

    recordAroundScrollPositions();
    output(`recorded at the top, over the modal: ${wheelTargetOver(modal)}`);

    window.scrollTo(0, 3900);
    output(`scrolled to the scroller, over it: ${wheelTargetOver(scroller)}`);
    output(`scrolled to the scroller, blocks wheels over it: ${blocksWheelsOver(scroller)}`);
    output(`scrolled to the scroller, over the modal: ${wheelTargetOver(modal)}`);

    recordAroundScrollPositions();
    output(`recorded there, over the scroller: ${wheelTargetOver(scroller)}`);
    output(`recorded there, blocks wheels over it: ${blocksWheelsOver(scroller)}`);

    window.scrollTo(0, 0);
    recordWholeDocument();
    window.scrollTo(0, 3900);
    output(`recorded the whole document at the top, then scrolled to the scroller, over it: ${wheelTargetOver(scroller)}`);
});
</script>
