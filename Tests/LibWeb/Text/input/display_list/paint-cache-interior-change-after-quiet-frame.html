<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #container { display: flow-root; padding: 4px; }
    .card { display: flow-root; margin: 0 0 4px; padding: 4px; border: 1px solid #ccc; }
</style>
<body id="body">
<div id="container"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        for (let i = 0; i < 2; ++i) {
            const card = document.createElement("div");
            card.id = `card${i}`;
            card.className = "card";
            card.textContent = `Card ${i}`;
            container.appendChild(card);
        }
    },
    steps: [
        {
            name: "first interior change",
            mutate: () => { card0.style.color = "red"; },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#container/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#container/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#card0.card/descendants(background-and-borders) RECOMPOSE
                          BlockContainer<DIV>#card0.card/background/hit-test RECORD
                          BlockContainer<DIV>#card0.card/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#card0.card/background SKIP
                          BlockContainer<DIV>#card0.card/border RECORD
                    BlockContainer<BODY>#body/descendants(foreground) RECOMPOSE
                      BlockContainer<DIV>#container/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#card0.card/descendants(foreground) RECOMPOSE
                          BlockContainer<DIV>#card0.card/foreground/hit-test RECORD
                          BlockContainer<DIV>#card0.card/foreground RECORD
                          BlockContainer<DIV>#card0.card/outline SKIP
                          BlockContainer<DIV>#card0.card/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#card0.card/overlay SKIP
            `
        },
        {
            name: "quiet recording",
            expect: `
                @canvas RECORD (empty)
                @viewport REUSE WHOLE CAPTURE
            `
        },
        {
            name: "second interior change",
            mutate: () => { card0.style.color = "blue"; },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#container/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#container/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#card0.card/descendants(background-and-borders) RECOMPOSE
                          BlockContainer<DIV>#card0.card/background/hit-test RECORD
                          BlockContainer<DIV>#card0.card/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#card0.card/background SKIP
                          BlockContainer<DIV>#card0.card/border RECORD
                    BlockContainer<BODY>#body/descendants(foreground) RECOMPOSE
                      BlockContainer<DIV>#container/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#card0.card/descendants(foreground) RECOMPOSE
                          BlockContainer<DIV>#card0.card/foreground/hit-test RECORD
                          BlockContainer<DIV>#card0.card/foreground RECORD
                          BlockContainer<DIV>#card0.card/outline SKIP
                          BlockContainer<DIV>#card0.card/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#card0.card/overlay SKIP
            `
        }
    ]
});
</script>
