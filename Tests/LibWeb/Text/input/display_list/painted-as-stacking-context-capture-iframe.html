<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #root { position: relative; width: 200px; }
    iframe { display: block; width: 100px; height: 60px; border: 0; }
    #after { height: 20px; }
</style>
<body id="body">
<div id="root"><iframe id="frame" srcdoc="<div style='height:60px;background:lime'></div>"></iframe><div id="after">after</div></div>
<script>
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet iframe",
            expect: `
                @canvas RECORD (empty)
                @viewport REUSE WHOLE CAPTURE
            `
        },
        {
            name: "change next to iframe",
            mutate: () => { after.style.color = "red"; },
            check: equal => { equal(document.elementFromPoint(50, 30).id, "frame", "hit target"); },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                    BlockContainer<DIV>#root RECOMPOSE
                      BlockContainer<DIV>#root/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#after/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#after/background/hit-test RECORD
                        BlockContainer<DIV>#after/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#after/background SKIP
                        BlockContainer<DIV>#after/border SKIP
                      BlockContainer<DIV>#after/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#after/foreground/hit-test RECORD
                        BlockContainer<DIV>#after/foreground RECORD
                        BlockContainer<DIV>#after/outline SKIP
                        BlockContainer<DIV>#after/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#after/overlay SKIP
            `
        },
        {
            name: "quiet after adjacent change",
            expect: `
                @canvas RECORD (empty)
                @viewport REUSE WHOLE CAPTURE
            `
        }
    ]
});
</script>
