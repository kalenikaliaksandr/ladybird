<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #a, #b { position: relative; width: 200px; }
    .row { padding: 2px; border-bottom: 1px solid #ccc; }
</style>
<body id="body">
<div id="a"><div class="row" id="a0">A 0</div></div>
<div id="b"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        for (let i = 0; i < 2; ++i) {
            const row = document.createElement("div");
            row.id = `b${i}`;
            row.className = "row";
            row.textContent = `B ${i}`;
            b.appendChild(row);
        }
    },
    steps: [
        {
            name: "first interior change",
            mutate: () => { b0.style.color = "red"; },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                    BlockContainer<DIV>#b RECOMPOSE
                      BlockContainer<DIV>#b/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#b0.row/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#b0.row/background/hit-test RECORD
                        BlockContainer<DIV>#b0.row/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#b0.row/background SKIP
                        BlockContainer<DIV>#b0.row/border RECORD
                      BlockContainer<DIV>#b0.row/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#b0.row/foreground/hit-test RECORD
                        BlockContainer<DIV>#b0.row/foreground RECORD
                        BlockContainer<DIV>#b0.row/outline SKIP
                        BlockContainer<DIV>#b0.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b0.row/overlay SKIP
            `
        },
        {
            name: "first quiet recording",
            expect: `
                @canvas RECORD (empty)
                @viewport REUSE WHOLE CAPTURE
            `
        },
        {
            name: "second quiet recording",
            expect: `
                @canvas RECORD (empty)
                @viewport REUSE WHOLE CAPTURE
            `
        },
        {
            name: "second interior change",
            mutate: () => { b0.style.color = "blue"; },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                    BlockContainer<DIV>#b RECOMPOSE
                      BlockContainer<DIV>#b/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#b0.row/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#b0.row/background/hit-test RECORD
                        BlockContainer<DIV>#b0.row/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#b0.row/background SKIP
                        BlockContainer<DIV>#b0.row/border RECORD
                      BlockContainer<DIV>#b0.row/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#b0.row/foreground/hit-test RECORD
                        BlockContainer<DIV>#b0.row/foreground RECORD
                        BlockContainer<DIV>#b0.row/outline SKIP
                        BlockContainer<DIV>#b0.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b0.row/overlay SKIP
            `
        }
    ]
});
</script>
