<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #root { position: relative; width: 200px; mask-image: linear-gradient(black, transparent); }
    .row { height: 20px; }
</style>
<body id="body">
<div id="root"><div class="row" id="r0">R 0</div><div class="row" id="r1">R 1</div><div class="row" id="r2">R 2</div></div>
<script>
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet masked root",
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<DIV>#root RECOMPOSE
                      BlockContainer<DIV>#root/css-mask RECORD
            `
        },
        {
            name: "change inside masked root",
            mutate: () => { r1.style.color = "red"; },
            check: equal => { equal(document.elementFromPoint(10, 30).id, "r1", "hit target"); },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                    BlockContainer<DIV>#root RECOMPOSE
                      BlockContainer<DIV>#root/css-mask RECORD
                      BlockContainer<DIV>#root/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#r1.row/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#r1.row/background/hit-test RECORD
                        BlockContainer<DIV>#r1.row/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#r1.row/background SKIP
                        BlockContainer<DIV>#r1.row/border SKIP
                      BlockContainer<DIV>#r1.row/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#r1.row/foreground/hit-test RECORD
                        BlockContainer<DIV>#r1.row/foreground RECORD
                        BlockContainer<DIV>#r1.row/outline SKIP
                        BlockContainer<DIV>#r1.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#r1.row/overlay SKIP
            `
        }
    ]
});
</script>
