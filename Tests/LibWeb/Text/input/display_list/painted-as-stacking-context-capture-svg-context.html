<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; }
    #root { position: relative; width: 100px; }
    svg { display: block; }
</style>
<body id="body">
<div id="root"><svg id="svg" width="100" height="100" style="opacity: 0.5"><rect id="rect" width="100" height="100" fill="url(#g)"/></svg></div>
<svg id="resources" width="0" height="0"><defs id="defs"><linearGradient id="g"><stop id="s0" offset="0" stop-color="red"/><stop id="s1" offset="1" stop-color="red"/></linearGradient></defs></svg>
<script>
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet SVG with external paint server",
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  BlockContainer<HTML>#html RECOMPOSE
                    SVGSVGBox<svg>#svg RECOMPOSE
                      SVGSVGBox<svg>#svg/svg WALK
                        SVGSVGBox<svg>#svg/foreground/hit-test RECORD (empty)
                        SVGSVGBox<svg>#svg/foreground RECORD (empty)
                        SVGGeometryBox<rect>#rect/svg WALK
                          SVGGeometryBox<rect>#rect/foreground/hit-test RECORD (empty)
                          SVGGeometryBox<rect>#rect/foreground RECORD
            `
        },
        {
            name: "edit external gradient",
            mutate: () => { s0.setAttribute("stop-color", "blue"); },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  BlockContainer<HTML>#html RECOMPOSE
                    SVGSVGBox<svg>#svg RECOMPOSE
                      SVGSVGBox<svg>#svg/svg WALK
                        SVGSVGBox<svg>#svg/foreground/hit-test RECORD (empty)
                        SVGSVGBox<svg>#svg/foreground RECORD (empty)
                        SVGGeometryBox<rect>#rect/svg WALK
                          SVGGeometryBox<rect>#rect/foreground/hit-test RECORD (empty)
                          SVGGeometryBox<rect>#rect/foreground RECORD
            `
        }
    ]
});
</script>
