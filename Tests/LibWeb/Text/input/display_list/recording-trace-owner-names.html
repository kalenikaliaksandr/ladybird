<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #first, #second { position: relative; width: 200px; }
</style>
<body id="body">
<div id="first"></div>
<div id="second"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        first.attachShadow({ mode: "open" }).innerHTML =
            '<style>#item::before { content: "pseudo"; display: block; background: lime; }</style>' +
            'anonymous before<div id="item">first</div>anonymous after';
        second.attachShadow({ mode: "open" }).innerHTML = '<div id="item">second</div>';
    },
    steps: [
        {
            name: "change one shadow owner with a pseudo-element",
            mutate: () => { first.shadowRoot.getElementById("item").style.color = "red"; },
            expect: `
                @canvas RECORD (empty)
                @viewport RECOMPOSE
                  @viewport/scroll-metadata RECORD (empty)
                  BlockContainer<HTML>#html RECOMPOSE
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<BODY>#body/descendants(background-and-borders) RECOMPOSE
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                    BlockContainer<DIV>#first RECOMPOSE
                      BlockContainer<DIV>#first/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#item/descendants(background-and-borders) RECOMPOSE
                        BlockContainer<DIV>#item/background/hit-test RECORD
                        BlockContainer<DIV>#item/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#item/background SKIP
                        BlockContainer<DIV>#item/border SKIP
                        BlockContainer(anonymous)/descendants(background-and-borders) RECOMPOSE
                          BlockContainer(anonymous)/background/hit-test RECORD
                          BlockContainer(anonymous)/scroll-metadata RECORD (empty)
                          BlockContainer(anonymous)/background RECORD
                          BlockContainer(anonymous)/border SKIP
                        BlockContainer(anonymous)/descendants(background-and-borders) RECOMPOSE
                          BlockContainer(anonymous)/background/hit-test RECORD (empty)
                          BlockContainer(anonymous)/scroll-metadata RECORD (empty)
                          BlockContainer(anonymous)/background SKIP
                          BlockContainer(anonymous)/border SKIP
                      BlockContainer<DIV>#item/descendants(foreground) RECOMPOSE
                        BlockContainer<DIV>#item/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#item/foreground RECORD (empty)
                        BlockContainer(anonymous)/descendants(foreground) RECOMPOSE
                          BlockContainer(anonymous)/foreground/hit-test RECORD
                          BlockContainer(anonymous)/foreground RECORD
                          BlockContainer(anonymous)/outline SKIP
                          BlockContainer(anonymous)/overlay/hit-test RECORD (empty)
                          BlockContainer(anonymous)/overlay SKIP
                        BlockContainer(anonymous)/descendants(foreground) RECOMPOSE
                          BlockContainer(anonymous)/foreground/hit-test RECORD
                          BlockContainer(anonymous)/foreground RECORD
                          BlockContainer(anonymous)/outline SKIP
                          BlockContainer(anonymous)/overlay/hit-test RECORD (empty)
                          BlockContainer(anonymous)/overlay SKIP
                        BlockContainer<DIV>#item/outline SKIP
                        BlockContainer<DIV>#item/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#item/overlay SKIP
            `,
        },
        {
            name: "quiet shadow trees",
            expect: `
                @canvas RECORD (empty)
                @viewport REUSE WHOLE CAPTURE
            `,
        },
    ],
});
</script>
