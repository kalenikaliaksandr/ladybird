<!DOCTYPE html>
<script src="../include.js"></script>
<svg width="100" height="100">
  <path id="p" d="M 10 10 L 50 50" stroke="black" fill="none"/>
  <foreignObject x="0" y="0" width="100" height="100">
    <div id="scroller" xmlns="http://www.w3.org/1999/xhtml" style="overflow:auto;width:80px;height:80px;">
      <div style="height:300px;background:black;"></div>
    </div>
  </foreignObject>
</svg>
<script>
test(() => {
    // Force initial layout
    internals.dumpDisplayList();

    // Trigger partial SVG relayout by mutating the path geometry. Scroll frames
    // must be reassigned afterwards: the scroller's paintable was reset during
    // the partial commit and would otherwise lose its scroll frame.
    document.getElementById("p").setAttribute("d", "M 10 10 L 90 90");

    // Capture display list after relayout before any println() calls.
    // println() modifies the DOM which would force a full layout rebuild
    // instead of the partial SVG relayout path we're testing.
    let displayList = internals.dumpDisplayList();

    println(displayList);
});
</script>
