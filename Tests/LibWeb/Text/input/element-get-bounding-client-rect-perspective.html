<!DOCTYPE html>
<style>
    * { margin: 0; padding: 0; }

    #grandparent {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 300px;
        height: 300px;
        perspective: 500px;
        background: rgba(128, 128, 128, 0.1);
    }

    #parent {
        position: absolute;
        left: 50px;
        top: 50px;
        width: 200px;
        height: 200px;
        transform: rotateY(45deg);
        background: rgba(128, 128, 128, 0.2);
    }

    #inner {
        position: absolute;
        left: 25px;
        top: 25px;
        width: 50px;
        height: 50px;
        background: red;
    }
</style>
<div id="grandparent">
    <div id="parent">
        <div id="inner"></div>
    </div>
</div>
<script src="include.js"></script>
<script>
    test(() => {
        // The grandparent has perspective: 500px.
        // The parent has rotateY(45deg), which combined with perspective creates 3D effect.
        // The inner div has no transform itself.
        //
        // The old get_client_rects() implementation only walked containing blocks
        // and composed their transforms, but didn't account for perspective from
        // ancestors. This test verifies perspective is properly applied.
        //
        // Without perspective: inner would be at (100+50+25, 100+50+25) = (175, 175)
        // With perspective and rotateY(45deg) on parent: the coordinates change
        // due to the 3D projection effect.
        const rect = document.getElementById("inner").getBoundingClientRect();
        println(`actual: x=${rect.x.toFixed(2)}, y=${rect.y.toFixed(2)}, w=${rect.width.toFixed(2)}, h=${rect.height.toFixed(2)}`);

        // With perspective properly applied, x should be ~197 (not 182 as old code gives)
        println(`x close to 197: ${Math.abs(rect.x - 197) < 1}`);
        println(`y is 175: ${Math.abs(rect.y - 175) < 1}`);
    });
</script>
