<!DOCTYPE html>
<svg id="svg" width="100" height="100">
    <path d="M 10 10 L 90 90"></path>
</svg>
<script src="../include.js"></script>
<script>
    test(() => {
        svg.getBoundingClientRect();
        internals.resetLayoutFfiCounters();
        svg.setAttribute("width", "101");
        svg.getBoundingClientRect();

        const counters = internals.layoutFfiCounters();
        println(`path handle retains: ${counters["crossings.svgPathRetainEntries"]}`);
        println(`path handle releases: ${counters["crossings.svgPathReleaseEntries"]}`);
        println(`path handles retained: ${counters["crossings.svgPathRetainEntries"] > 0}`);
        println(`path handles balanced: ${counters["crossings.svgPathRetainEntries"] === counters["crossings.svgPathReleaseEntries"]}`);
    });
</script>
