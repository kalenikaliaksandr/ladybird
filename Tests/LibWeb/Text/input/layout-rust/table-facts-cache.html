<!DOCTYPE html>
<style>
    table { border-collapse: collapse; width: 240px; }
    td { border: 1px solid; }
</style>
<table id="table">
    <tr><td>A</td><td>B</td></tr>
    <tr><td colspan="2">C</td></tr>
</table>
<script src="../include.js"></script>
<script>
    test(() => {
        // Complete the page's initial layout, then measure one fresh pass.
        table.offsetWidth;
        internals.resetLayoutFfiCounters();
        table.style.width = "241px";
        table.offsetWidth;

        const counters = internals.layoutFfiCounters();
        println(`style facts built: ${counters["ops.styleViewCreates"]}`);
        println(`box facts built: ${counters["crossings.boxFactsBuildEntries"]}`);
        println(`table facts built: ${counters["crossings.tableFactsBuildEntries"]}`);
        println(`style cache reused: ${counters["ops.styleViewCacheHits"] > 0}`);
        println(`at most one style build per visited box: ${counters["ops.styleViewCreates"] <= counters["crossings.boxFactsBuildEntries"]}`);
    });
</script>
