<!DOCTYPE html>
<style>
    table { border-collapse: collapse; width: 240px; }
    td { border: 1px solid; }
</style>
<table id="table">
    <tr><td>A</td><td>B</td></tr>
    <tr><td colspan="2">C</td></tr>
</table>
<script src="../include.js"></script>
<script>
    test(() => {
        // Complete the page's initial layout, then measure one fresh pass.
        table.offsetWidth;
        internals.resetLayoutFfiCounters();
        table.style.width = "241px";
        table.offsetWidth;

        const counters = internals.layoutFfiCounters();
        println(`style facts built: ${counters.styleFactsBuildEntries}`);
        println(`box facts built: ${counters.boxFactsBuildEntries}`);
        println(`table facts built: ${counters.tableFactsBuildEntries}`);
        println(`style cache reused: ${counters.styleFactsCacheHits > 0}`);
        println(`at most one style build per visited box: ${counters.styleFactsBuildEntries <= counters.boxFactsBuildEntries}`);
    });
</script>
