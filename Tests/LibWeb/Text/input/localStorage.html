<!DOCTYPE html>
<script src="include.js"></script>
<script>
    test(() => {
        const key = `localStorage-test-${crypto.randomUUID()}`;
        const indexedProperty = crypto.getRandomValues(new Uint32Array(1))[0];

        try {
            println(localStorage[key])
            println(localStorage.getItem(key))

            localStorage[key] = "value";
            println(localStorage[key]);
            println(localStorage.getItem(key));

            localStorage.setItem(key, "other");
            println(localStorage[key]);
            println(localStorage.getItem(key));

            // Ensure indexed properties work
            println(localStorage[indexedProperty])
            println(localStorage.getItem(indexedProperty))

            localStorage[indexedProperty] = "foo";
            println(localStorage[indexedProperty]);
            println(localStorage.getItem(indexedProperty));
        } finally {
            localStorage.removeItem(key);
            localStorage.removeItem(indexedProperty);
        }
    });
</script>
