<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
</style>
<div style="position: relative; width: 400px; height: 400px;">
    <div id="boundary" style="position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; overflow: hidden;">
        <!-- Abspos child centered with auto margins -->
        <div id="centered" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin: auto; width: 100px; height: 50px;"></div>
    </div>
</div>
<script>
test(() => {
    // Ensure initial full layout
    document.getElementById("centered").offsetWidth;

    // Change the centered child's dimensions
    document.getElementById("centered").style.width = "150px";
    document.getElementById("centered").style.height = "80px";

    // Partial relayout
    let partial = document.getElementById("centered").getBoundingClientRect();
    let pp_x = partial.x;
    let pp_y = partial.y;
    let pp_w = partial.width;
    let pp_h = partial.height;

    // Force full relayout
    println("partial: x=" + pp_x + " y=" + pp_y + " w=" + pp_w + " h=" + pp_h);

    // Full relayout
    let full = document.getElementById("centered").getBoundingClientRect();
    println("full: x=" + full.x + " y=" + full.y + " w=" + full.width + " h=" + full.height);

    println("pos match: " + (pp_x === full.x && pp_y === full.y));
    println("size match: " + (pp_w === full.width && pp_h === full.height));
});
</script>
