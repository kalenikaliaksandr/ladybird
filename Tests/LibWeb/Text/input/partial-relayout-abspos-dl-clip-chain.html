<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
</style>
<div style="position: relative; width: 400px; height: 400px;">
    <div id="boundary" style="position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; overflow: hidden; background: white;">
        <!-- Nested overflow:hidden to test clip chain correctness -->
        <div id="inner-clip" style="overflow: hidden; width: 150px; height: 100px; background: lightgray;">
            <div id="child" style="width: 100px; height: 50px; background: red;"></div>
        </div>
        <div id="sibling" style="height: 30px; background: blue;"></div>
    </div>
</div>
<script>
test(() => {
    document.getElementById("child").offsetWidth;

    // Change child to be larger than inner-clip (should be clipped)
    document.getElementById("child").style.width = "180px";
    document.getElementById("child").style.height = "130px";

    // Trigger partial relayout
    let childPartial = document.getElementById("child").getBoundingClientRect();

    // The child's getBoundingClientRect should return UNCLIPPED size
    let cp_w = childPartial.width;
    let cp_h = childPartial.height;

    println("child partial (unclipped): " + cp_w + "x" + cp_h);

    // Full relayout
    let childFull = document.getElementById("child").getBoundingClientRect();
    println("child full (unclipped): " + childFull.width + "x" + childFull.height);
    println("child match: " + (cp_w === childFull.width && cp_h === childFull.height));
});
</script>
