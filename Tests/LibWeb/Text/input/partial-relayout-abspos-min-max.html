<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
</style>
<div style="position: relative; width: 400px; height: 400px;">
    <div id="boundary" style="position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; overflow: hidden;">
        <!-- Children with min/max constraints -->
        <div id="child1" style="width: 100px; height: 50px; min-width: 80px; max-width: 180px;"></div>
        <div id="child2" style="width: auto; height: 40px; min-height: 20px; max-height: 60px;"></div>
        <div id="after" style="height: 20px;"></div>
    </div>
</div>
<script>
test(() => {
    // Ensure initial full layout
    document.getElementById("child1").offsetWidth;

    // Change to values that should be clamped by min/max
    document.getElementById("child1").style.width = "50px"; // Should be clamped to min-width: 80px
    document.getElementById("child2").style.height = "100px"; // Should be clamped to max-height: 60px

    // Partial relayout
    let c1Partial = document.getElementById("child1").getBoundingClientRect();
    let c2Partial = document.getElementById("child2").getBoundingClientRect();
    let afterPartial = document.getElementById("after").getBoundingClientRect();

    let c1_w = c1Partial.width;
    let c2_h = c2Partial.height;
    let a_y = afterPartial.y;

    println("child1 partial w: " + c1_w);
    println("child2 partial h: " + c2_h);
    println("after partial y: " + a_y);

    // Full relayout
    let c1Full = document.getElementById("child1").getBoundingClientRect();
    let c2Full = document.getElementById("child2").getBoundingClientRect();
    let afterFull = document.getElementById("after").getBoundingClientRect();

    println("child1 full w: " + c1Full.width);
    println("child2 full h: " + c2Full.height);
    println("after full y: " + afterFull.y);

    println("child1 match: " + (c1_w === c1Full.width));
    println("child2 match: " + (c2_h === c2Full.height));
    println("after match: " + (a_y === afterFull.y));
});
</script>
