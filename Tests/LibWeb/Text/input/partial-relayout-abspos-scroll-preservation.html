<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
    * { scrollbar-width: none; }
</style>
<div style="position: relative; width: 400px; height: 400px;">
    <div id="boundary" style="position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; overflow: scroll;">
        <div id="child" style="width: 100px; height: 50px;"></div>
        <div style="height: 500px;"></div> <!-- make it scrollable -->
    </div>
</div>
<script>
test(() => {
    document.getElementById("child").offsetWidth;

    // Scroll the boundary
    document.getElementById("boundary").scrollTop = 100;

    // Verify scroll position
    let scrollBefore = document.getElementById("boundary").scrollTop;

    // Change child - triggers partial relayout
    document.getElementById("child").style.width = "150px";
    document.getElementById("child").style.height = "80px";

    let childPartial = document.getElementById("child").getBoundingClientRect();
    let scrollAfter = document.getElementById("boundary").scrollTop;

    println("scroll before: " + scrollBefore);
    println("scroll after partial: " + scrollAfter);
    println("child partial: " + childPartial.width + "x" + childPartial.height);

    // Full relayout
    let childFull = document.getElementById("child").getBoundingClientRect();
    let scrollFull = document.getElementById("boundary").scrollTop;

    println("scroll after full: " + scrollFull);
    println("child full: " + childFull.width + "x" + childFull.height);

    println("scroll preserved: " + (scrollBefore === scrollAfter));
    println("child match: " + (childPartial.width === childFull.width && childPartial.height === childFull.height));
});
</script>
