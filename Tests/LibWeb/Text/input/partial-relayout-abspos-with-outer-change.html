<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
</style>
<div style="position: relative; width: 400px; height: 400px;">
    <div id="boundary" style="position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; overflow: hidden;">
        <div id="child" style="width: 100px; height: 50px;"></div>
    </div>
    <!-- Sibling that also changes - should trigger full layout -->
    <div id="outer-sibling" style="height: 50px;"></div>
</div>
<script>
test(() => {
    // Ensure initial full layout
    document.getElementById("child").offsetWidth;

    // Modify BOTH inside and outside boundary simultaneously
    document.getElementById("child").style.width = "150px";
    document.getElementById("outer-sibling").style.height = "100px";

    // This should trigger FULL layout (since both boundary and viewport need update)
    let childResult = document.getElementById("child").getBoundingClientRect();
    let siblingResult = document.getElementById("outer-sibling").getBoundingClientRect();

    println("child: " + childResult.width + "x" + childResult.height);
    println("outer sibling h: " + siblingResult.height);

    // Full relayout again
    let childFull = document.getElementById("child").getBoundingClientRect();
    println("child full: " + childFull.width + "x" + childFull.height);
    println("child match: " + (childResult.width === childFull.width));
});
</script>
