<!DOCTYPE html>
<style>
body { margin: 0; }
p { margin: 10px; font: 40px "Liberation Mono", monospace; }
</style>
<p dir="rtl"><span id="rtl">אבגדה</span></p>
<p dir="ltr"><span id="ltr">abcde</span></p>
<p dir="rtl"><span id="rtl-word">שלום</span></p>
<script src="include.js"></script>
<script>
    // Range rects of right-to-left text cover the characters at their logical offsets, which run from the right.
    test(() => {
        const format = rect => `${Math.round(rect.left)}..${Math.round(rect.right)}`;
        for (const id of ["rtl", "ltr", "rtl-word"]) {
            const span = document.getElementById(id);
            const text = span.firstChild;
            println(`${id}: span ${format(span.getBoundingClientRect())}`);
            for (const [start, end] of [[0, 1], [1, 3], [3, 4]]) {
                const range = document.createRange();
                range.setStart(text, start);
                range.setEnd(text, end);
                const rects = [...range.getClientRects()].map(format).join(" ");
                println(`  [${start}, ${end}): ${rects}, bounding ${format(range.getBoundingClientRect())}`);
            }
        }
    });
</script>
