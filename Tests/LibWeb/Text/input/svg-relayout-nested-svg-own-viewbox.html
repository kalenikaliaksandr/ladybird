<!DOCTYPE html>
<script src="include.js"></script>
<svg width="100" height="100" viewBox="0 0 10 10">
    <svg x="1" y="1" width="8" height="8" viewBox="0 0 4 4">
        <rect id="r" width="2" height="1" fill="blue"/>
    </svg>
</svg>
<script>
    asyncTest(async (done) => {
        // Force initial layout to complete.
        document.body.offsetHeight;

        // Mutate geometry inside a nested <svg> that has its own viewBox, under a
        // 10x viewBox-scaled outer root. The partial relayout rooted at the inner
        // svg must produce the same result as a full layout: 3x1 units under the
        // inner 2x viewBox scale and the outer 10x scale is 60x20 CSS pixels.
        document.getElementById("r").setAttribute("width", "3");
        document.body.offsetHeight;

        const rect = document.getElementById("r").getBoundingClientRect();
        println(rect.width + "x" + rect.height);
        println(Math.abs(rect.width - 60) < 0.01 && Math.abs(rect.height - 20) < 0.01 ? "PASS" : "FAIL");
        done();
    });
</script>
