<!DOCTYPE html>
<script src="include.js"></script>
<svg width="200" height="100" viewBox="0 0 20 10">
    <svg x="2" y="1" width="16" height="8">
        <text id="t" x="1" y="4" font-size="3">ab</text>
    </svg>
</svg>
<script>
    asyncTest(async (done) => {
        // Force initial layout to complete.
        document.body.offsetHeight;

        // Mutate text inside a nested <svg> under a viewBox-scaled outer root and
        // compare the partial relayout result against a forced full layout: both
        // must produce identical geometry.
        document.getElementById("t").textContent = "abcd";
        document.body.offsetHeight;
        const partial = document.getElementById("t").getBoundingClientRect();

        // Dirty layout outside the SVG so the next update runs a full layout.
        document.body.style.paddingLeft = "1px";
        document.body.offsetHeight;
        document.body.style.paddingLeft = "";
        document.body.offsetHeight;
        const full = document.getElementById("t").getBoundingClientRect();

        const same = Math.abs(partial.width - full.width) < 0.01
            && Math.abs(partial.height - full.height) < 0.01
            && Math.abs(partial.x - full.x) < 0.01
            && Math.abs(partial.y - full.y) < 0.01;
        println(same ? "PASS" : `FAIL: partial ${partial.x},${partial.y} ${partial.width}x${partial.height} vs full ${full.x},${full.y} ${full.width}x${full.height}`);
        done();
    });
</script>
